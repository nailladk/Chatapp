<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="logo">⭑—our chat𖦹°</div>
            <ul class="contact-list">
                <li class="contact active">siapa cie</li>
                <li class="contact">ppl 1</li>
                <li class="contact">ppl 2</li>
            </ul>
        </div>
        <div class="chat-section">
            <div class="chat-header">
                <div class="chat-title">siapa tebak</div>
                <div class="chat-options">...</div>
            <div class="chat-body">
                <div class="message received">halo tes</div>
                <div class="message sent">siapa ya?</div>
                <div class="message received">🤫🧏‍♀️</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message...">
                <button>Send</button>
            </div>
        </div>
    </div>
</body>
</html>
